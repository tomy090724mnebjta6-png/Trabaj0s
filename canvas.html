<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Juego - Atrapa la moneda</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: #222;
            color: white;
        }

        canvas {
            background-color: #87CEEB;
            border: 4px solid white;
        }
    </style>
</head>

<body>

    <h1>🎮 Atrapa la moneda</h1>
    <p>Puntaje: <span id="puntos">0</span></p>

    <canvas id="juego" width="600" height="400"></canvas>

    <script>

        const canvas = document.getElementById("juego");
        const ctx = canvas.getContext("2d");

        let jugador = {
            x: 275,
            y: 340,
            ancho: 50,
            alto: 30,
            velocidad: 7
        };

        let moneda = {
            x: Math.random() * 570,
            y: 50,
            radio: 15,
            velocidad: 3
        };

        let puntos = 0;

        let teclas = {};

        document.addEventListener("keydown", function(evento) {
            teclas[evento.key] = true;
        });

        document.addEventListener("keyup", function(evento) {
            teclas[evento.key] = false;
        });

        function dibujarJugador() {
            ctx.fillStyle = "red";
            ctx.fillRect(
                jugador.x,
                jugador.y,
                jugador.ancho,
                jugador.alto
            );
        }

        function dibujarMoneda() {
            ctx.beginPath();

            ctx.fillStyle = "gold";

            ctx.arc(
                moneda.x,
                moneda.y,
                moneda.radio,
                0,
                Math.PI * 2
            );

            ctx.fill();

            ctx.closePath();
        }

        function moverJugador() {

            if (teclas["ArrowLeft"]) {
                jugador.x -= jugador.velocidad;
            }

            if (teclas["ArrowRight"]) {
                jugador.x += jugador.velocidad;
            }

            if (jugador.x < 0) {
                jugador.x = 0;
            }

            if (jugador.x + jugador.ancho > canvas.width) {
                jugador.x = canvas.width - jugador.ancho;
            }
        }

        function moverMoneda() {

            moneda.y += moneda.velocidad;

            if (moneda.y > canvas.height) {

                moneda.y = 0;

                moneda.x =
                    Math.random() * (canvas.width - 30) + 15;
            }
        }

        function detectarColision() {

            if (
                moneda.x > jugador.x &&
                moneda.x < jugador.x + jugador.ancho &&
                moneda.y + moneda.radio > jugador.y &&
                moneda.y - moneda.radio < jugador.y + jugador.alto
            ) {

                puntos++;

                document.getElementById("puntos").textContent = puntos;

                moneda.y = 0;

                moneda.x =
                    Math.random() * (canvas.width - 30) + 15;
            }
        }

        function dibujar() {

            ctx.clearRect(
                0,
                0,
                canvas.width,
                canvas.height
            );

            dibujarJugador();

            dibujarMoneda();

            moverJugador();

            moverMoneda();

            detectarColision();

            requestAnimationFrame(dibujar);
        }

        dibujar();

    </script>

</body>
</html>
